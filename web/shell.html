html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #E8E4C8;
	background-color: #000;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background-color: $GODOT_SPLASH_COLOR;
	visibility: hidden;
}

#status-splash {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	object-fit: contain;
	image-rendering: pixelated;
}

#status-splash.show-image--false {
	display: none;
}

#loader {
	position: absolute;
	left: 50%;
	bottom: 12%;
	width: min(46%, 380px);
	transform: translateX(-50%);
	display: none;
	text-align: center;
	font-family: 'Alagard', Georgia, serif;
}

#loader-label {
	font-size: clamp(16px, 3.4vw, 26px);
	letter-spacing: 1px;
	margin-bottom: 8px;
	/* 2px ink outline, matching the in-game text treatment. */
	text-shadow:
		-2px 0 #10180F, 2px 0 #10180F, 0 -2px #10180F, 0 2px #10180F,
		-2px -2px #10180F, 2px -2px #10180F, -2px 2px #10180F, 2px 2px #10180F;
}

/* Bar styled like the game's bevel frames: ink border, deep panel,
   gold fill with a darker bottom edge. */
#loader-bar {
	position: relative;
	height: 18px;
	border: 3px solid #10180F;
	background: #1F3026;
	box-shadow: inset 0 2px 0 #101A11;
	overflow: hidden;
}

#loader-fill {
	position: absolute;
	left: 0;
	top: 0;
	bottom: 0;
	width: 0%;
	background: #F2C84B;
	box-shadow: inset 0 -4px 0 #B58A1C, inset 0 3px 0 #F7DC86;
	transition: width 0.15s linear;
}

/* Before the download size is known: a gold block sweeps back and forth. */
#loader-bar.indeterminate #loader-fill {
	width: 30%;
	transition: none;
	animation: sweep 1.1s ease-in-out infinite alternate;
}

@keyframes sweep {
	from { left: 0%; }
	to { left: 70%; }
}

#status-notice {
	position: absolute;
	left: 2rem;
	right: 2rem;
	top: 50%;
	transform: translateY(-50%);
	display: none;
	background-color: #1F3026;
	border: 3px solid #10180F;
	color: #E8E4C8;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<div id="loader">
				<div id="loader-label">Loading...</div>
				<div id="loader-bar" class="indeterminate"><div id="loader-fill"></div></div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const loader = document.getElementById('loader');
	const loaderLabel = document.getElementById('loader-label');
	const loaderBar = document.getElementById('loader-bar');
	const loaderFill = document.getElementById('loader-fill');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		loader.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setProgress(current, total) {
		if (current > 0 && total > 0) {
			const pct = Math.min(100, Math.floor((current / total) * 100));
			loaderBar.classList.remove('indeterminate');
			loaderFill.style.width = pct + '%';
			loaderLabel.textContent = pct >= 100 ? 'Starting adventure...' : 'Loading... ' + pct + '%';
		} else {
			loaderBar.classList.add('indeterminate');
			loaderLabel.textContent = 'Loading...';
		}
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': setProgress,
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
